# ======================================================
# AllumStuff — конфигурация
# ======================================================

restart:
  # Интервал между автоматическими рестартами, в минутах
  interval-minutes: 180
  # За сколько минут до рестарта показывать предупреждение и открывать голосование
  warning-minutes: 5
  # На сколько минут откладывать рестарт, если наберётся достаточно голосов "против"
  postpone-minutes: 60
  # Необязательная команда операционной системы, которая будет запущена перед остановкой
  # сервера (например, свой скрипт автоперезапуска). Оставьте пустым, если не нужно —
  # тогда плагин просто безопасно остановит сервер, как обычная команда /stop.
  shell-command-before-stop: ""
  messages:
    warning: "&e[Сервер] &fРестарт через 5 минут. Если вы против - пропишите &a/rskip&f."
    vote-registered: "&e[Сервер] &fТвой голос против рестарта учтён (&a%votes%&f/&c%needed%&f)."
    vote-already: "&e[Сервер] &fТы уже голосовал(а) против этого рестарта."
    vote-none-active: "&e[Сервер] &fСейчас нет голосования за перенос рестарта."
    postponed: "&e[Сервер] &aРестарт отложен на 1 час — игроки проголосовали против."
    final-countdown: "&e[Сервер] &cПерезапуск сервера прямо сейчас!"

chat:
  # Радиус локального чата в блоках
  local-radius: 150
  tags:
    global: "&a[G]"
    local: "&e[L]"
  bubble:
    enabled: true
    duration-seconds: 4
    # Обновление позиции пузыря (в тиках, 20 тиков = 1 секунда)
    update-interval-ticks: 2
    background-opacity: 40   # 0-255, прозрачность фона таблички

sleep:
  # Через сколько секунд после начала сна пропускается ночь, если никто не отменил
  skip-delay-seconds: 6
  messages:
    started: "&b[Сон] &f%player% начал(а) спать. Чтобы отменить пропуск ночи - &a/nskip&f."
    cancelled: "&b[Сон] &fПропуск ночи отменён игроком %player%."
    skipped: "&b[Сон] &fНочь пропущена."

title:
  max-length: 24
